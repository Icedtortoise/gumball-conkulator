<!DOCTYPE html>
<html>
    <head>
        <title>Gumbal calculator</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kablammo&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css"/>
    </head>
    <body class="kablammo-font">
        <header>
            <img class="banner" src="./images/banner.png"/>
            <h6 class="note">boom now you don't have to ask me :earn:🪗</h6>
        </header>
        <main>
            <form id="Calculator">
                <label for="mtg">$Money -> Gumballs</label>
                <input type="radio" id="mtg" name="calculation" value="1" required>
                <label for="gtm">Gumballs -> Money</label>
                <input type="radio" id="gtm" name="calculation" value="2" required>
                <label for="gumb">Secret third thing</label>
                <input type="radio" id="gumb" name="calculation" value="3" required><br>

                <label for="money">Money amount(eg.  $0.25) $</label>
                <input type="number" id="money" min="0" name="money" value="0" step="0.25">
                <label for="gumballs">Gumball amount</label>
                <input type="number" id="gumballs" min="0" name="gumballs" value="0"><br>

                <input type="submit" value="submit">
            </form>

            <p id="result">🤔</p>
        </main>
        <script src="./calculator.js"></script>
    </body>
</html>
